<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Aadhaar</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="font-awesome/css/font-awesome.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://www.gstatic.com/firebasejs/4.11.0/firebase.js"></script>
    <script>
        // Initialize Firebase
        var config = {
            apiKey: "AIzaSyD8S8A9XZRU3UAvjenDjm-xdBKmn1NOSR0",
            authDomain: "voting-3eed6.firebaseapp.com",
            databaseURL: "https://voting-3eed6.firebaseio.com",
            projectId: "voting-3eed6",
            storageBucket: "voting-3eed6.appspot.com",
            messagingSenderId: "376658495838"
        };
        firebase.initializeApp(config);
    </script>

    <style>
        /* Body and Font */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Nav Bar Styling */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #004d40;
            padding: 10px 20px;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logout {
            padding: 10px 20px;
            background-color: white;
            color: #004d40;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        .logout:hover {
            background-color: #027663;
            color: white;
        }

        /* Centered Login Box */
        .loginscreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90dvh;
            
            max-height: 95dvh;
            background-color: #f4f4f4;
        }

        .loginscreen .middle-box {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .middle-box .logo-name img {
            width: 150px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn-primary {
            background-color: #004d40;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #027663;
        }

        .footer {
            background-color: #a3a3a3; /* Dark green */
            color: white;
            text-align: center;
            padding: 10px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .footer img {
            max-width: 300px;
        }

        /* Alert Box */
        #errorbox {
            display: none;
        }

        #errorbox.show {
            display: block;
        }
    </style>

</head>
<body>

    <!-- Nav Bar -->
    <nav>
        <div class="logo">YourLogo</div>
        <a href="/result.html" class="logout" style="width: 40dvh;text-align: center">Election Result</a>
        <a href="/logout" class="logout">Logout</a>
    </nav>

    <!-- Main Content -->
    <div class="loginscreen">
        <div class="middle-box animated fadeInDown">
            <div>
                <div>
                    <h1 class="logo-name"><img src="images/e-voting-logo.png" alt="E-Voting Logo"></h1>
                </div>
                <h3>Verify Aadhaar</h3>
                <div id="verify_otp_model">
                    <div class="form-group">
                        <input onkeypress="return isNumberKey(event)" id="verify_otp" name="aadhaarno" class="form-control" placeholder="Enter OTP" required autofocus>
                    </div>
                    <button id="verifyotp" class="btn btn-primary">Verify OTP</button>
                </div>

                <div id="enter_aadhaarno">
                    <div class="form-group">
                        <input onkeypress="return isNumberKey(event)" id="aadhaar_no" name="aadhaarno" class="form-control" placeholder="Aadhaar No" required autofocus>
                    </div>
                    <button id="getotp" class="btn btn-primary">Get OTP</button>
                </div>

                <!-- Error Message Box -->
                <div id="errorbox" class="alert alert-danger fade in">
                    <a href="#" class="close" data-dismiss="alert">&times;</a>
                    <strong id="error">Error!</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div>
            <a href="/"><img src="https://www.eci.gov.in/newimg/eci-logo.svg" alt="ECI Logo"></a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/app.js"></script>

</body>
</html>
